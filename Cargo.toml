[package]
name = "det-prime"
version = "0.1.1"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
description = "Primality testing without randomness for no_std and Wasm: always correct below 2^64, correct above it assuming GRH. Also hash-to-prime and modular square roots."
repository = "https://github.com/san-digital/det-prime"
homepage = "https://github.com/san-digital/det-prime"
documentation = "https://docs.rs/det-prime"
readme = "README.md"
keywords = ["primality", "cryptography", "no-std", "wasm", "number-theory"]
categories = ["cryptography", "mathematics", "no-std", "wasm"]

[features]
default = ["std"]
std = []

[dependencies]

[workspace]
